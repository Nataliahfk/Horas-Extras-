
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro Diario - Contador de Horas Extras</title>
<style>
body{font-family:Arial,sans-serif;background:#efe8dd;margin:25px}
.titulo{text-align:center;margin-bottom:30px}
.titulo h1{margin:0;color:#243b5a;font-size:40px}
.titulo h2{margin:8px 0 0;color:#8c6b3d;font-size:22px;font-weight:500}
h3{color:#243b5a}
input,select,button{padding:10px;border:1px solid #aaa;border-radius:5px}
.btn-add{background:#1f2937;color:#fff}
.btn-del{background:#c0392b;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:#fff;border:1px solid #d8cdbd;border-radius:10px;padding:15px}
.small{font-size:11px}.big{font-size:34px}
progress{width:100%;height:10px}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:20px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
.icon{background:#d9534f;color:#fff;border:none;border-radius:4px;padding:4px 8px}
</style>
</head>
<body>
<div class="titulo">
<h1>Registro Diario</h1>
<h2>Contador de Horas Extras</h2>
</div>

<h3>01 REGISTRAR DÍA</h3>
<select id="p"></select>
<input id="f" type="date">
<input id="h" type="number" step="0.5" placeholder="Horas">
<button class="btn-add" onclick="agregar()">Agregar Registro</button>
<button class="btn-del" onclick="borrarUltimo()">Borrar Registro</button>

<h3>02 ACUMULADO POR PERSONA</h3>
<div id="cards" class="grid"></div>

<h3>03 HISTORIAL DE REGISTROS</h3>
<table><thead><tr><th>Persona</th><th>Fecha</th><th>Horas</th><th>Acción</th></tr></thead><tbody id="hist"></tbody></table>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEDeXM4UMKZl3uUjjTcz643MitYsHl4A-P6RYw3707bjSByZPRrCBBzixF021wWXlweA/exec";
const personas = ["Bastian","Benjamin","Carolyn","Daniela O","Daniela P","Francisca","Katerine","Natalia","Paola","Roberto"];
let reg = [];

personas.forEach(x => p.innerHTML += `<option>${x}</option>`);
const col = v => v >= 40 ? "red" : v >= 30 ? "orange" : "green";

// CARGAR DATOS DESDE GOOGLE SHEETS
async function cargarDesdeSheets() {
  try {
    const res = await fetch(SCRIPT_URL);
    const data = await res.json();
    
    // Mapeamos los datos de la hoja para que coincidan con tus nombres {p, f, h}
    reg = data.map(item => ({
      p: item.persona,
      f: item.fecha,
      h: item.horas
    }));
    
    render();
  } catch (err) {
    console.error("Error al obtener datos:", err);
  }
}

function render() {
  cards.innerHTML = "";
  hist.innerHTML = "";

  personas.forEach(n => {
    let t = reg.filter(r => r.p === n).reduce((a, b) => a + Number(b.h), 0);
    cards.innerHTML += `<div class='card'><b>${n}</b><div class='small'>HORAS EXTRA ACUMULADAS</div><div class='big'>${t.toFixed(1)} h</div></div>`;
  });

  if (!reg.length) {
    hist.innerHTML = "<tr><td colspan='4'>Aún no hay registros.</td></tr>";
  }

  reg.forEach((r, i) => {
    hist.innerHTML += `<tr><td>${r.p}</td><td>${r.f}</td><td>${r.h}</td><td><button class='icon' onclick='eliminar(${i})'>🗑️</button></td></tr>`;
  });
}

// AGREGAR REGISTRO EN GOOGLE SHEETS
async function agregar() {
  if (!f.value || !h.value) return alert("Complete los datos");

  const nuevoRegistro = { p: p.value, f: f.value, h: h.value };
  reg.push(nuevoRegistro);
  render(); // Actualiza la pantalla inmediatamente

  // Envía a Google Sheets en segundo plano
  await fetch(SCRIPT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "ADD",
      persona: p.value,
      fecha: f.value,
      horas: h.value
    })
  });
}

// ELIMINAR REGISTRO EN GOOGLE SHEETS
async function eliminar(i) {
  if (confirm("¿Eliminar registro?")) {
    const borrado = reg[i];
    reg.splice(i, 1);
    render();

    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "DELETE",
        persona: borrado.p,
        fecha: borrado.f
      })
    });
  }
}

// Carga inicial al abrir la página
cargarDesdeSheets();
</script>
</body></html>
