<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro Diario - Contador de Horas Extras</title>
<style>
body{font-family:Arial,sans-serif;background:#efe8dd;margin:25px}
.titulo{text-align:center;margin-bottom:30px}
.titulo h1{margin:0;color:#243b5a;font-size:40px}
.titulo h2{margin:8px 0 0;color:#8c6b3d;font-size:22px;font-weight:500}
h3{color:#243b5a}
input,select,button{padding:10px;border:1px solid #aaa;border-radius:5px}
.btn-add{background:#1f2937;color:#fff;cursor:pointer}
.btn-del{background:#c0392b;color:#fff;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{background:#fff;border:1px solid #d8cdbd;border-radius:10px;padding:15px}
.small{font-size:11px}.big{font-size:34px}
progress{width:100%;height:10px}
table{width:100%;border-collapse:collapse;background:#fff;margin-top:20px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
.icon{background:#d9534f;color:#fff;border:none;border-radius:4px;padding:4px 8px}
</style>
</head>
<body>
<div class="titulo">
<h1>Registro Diario</h1>
<h2>Contador de Horas Extras</h2>
</div>

<h3>01 REGISTRAR DÍA</h3>
<select id="p"></select>
<input id="f" type="date">
<input id="h" type="number" step="0.5" placeholder="Horas">
<button type="button" class="btn-add" onclick="agregar()">Agregar Registro</button>
<button type="button" class="btn-del" onclick="borrarUltimo()">Borrar Registro</button>

<h3>02 ACUMULADO POR PERSONA</h3>
<div id="cards" class="grid"></div>

<h3>03 HISTORIAL DE REGISTROS</h3>
<table><thead><tr><th>Persona</th><th>Fecha</th><th>Horas</th><th>Acción</th></tr></thead><tbody id="hist"></tbody></table>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEDeXM4UMKZl3uUjjTcz643MitYsHl4A-P6RYw3707bjSByZPRrCBBzixF021wWXlweA/exec";

const personas = ["Bastian","Benjamin","Carolyn","Daniela O","Daniela P","Francisca","Katerine","Natalia","Paola","Roberto"];
let reg = [];

// Elementos del DOM
const p = document.getElementById("p");
const f = document.getElementById("f");
const h = document.getElementById("h");

// Cargar desplegable de personas
if (p) {
  p.innerHTML = "";
  personas.forEach(x => p.innerHTML += `<option value="${x}">${x}</option>`);
}

// Cargar registros desde Google Sheets
async function cargarDesdeSheets() {
  try {
    const res = await fetch(SCRIPT_URL + "?t=" + new Date().getTime());
    const data = await res.json();
    if (Array.isArray(data)) {
      reg = data.map(item => ({
        p: item.persona,
        f: item.fecha,
        h: parseFloat(item.horas) || 0
      }));
    }
    render();
  } catch (err) {
    console.error("Error al conectar con Google Sheets:", err);
    render();
  }
}

function render() {
  // 1. RENDERIZAR TARJETAS DE ACUMULADOS
  const containerCards = document.getElementById("cards");
  if (containerCards) {
    containerCards.innerHTML = "";
    personas.forEach(n => {
      let t = reg.filter(r => r.p === n).reduce((a, b) => a + Number(b.h), 0);
      let pct = Math.min((t / 40) * 100, 100);
      let col = t >= 40 ? "#dc2626" : t >= 30 ? "#f59e0b" : "#16a34a";

      containerCards.innerHTML += `
        <div class="card" style="background:#fff; padding:15px; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,0.08); font-family:sans-serif;">
          <b style="font-size:1.1em; color:#0f172a;">${n}</b>
          <div style="font-size:0.68em; color:#64748b; font-weight:bold; margin-top:3px; letter-spacing:0.5px;">HORAS EXTRA ACUMULADAS</div>
          <div style="font-size:1.8em; font-weight:bold; margin:6px 0; color:#0f172a;">${t.toFixed(1)} h</div>
          <div style="width:100%; background:#e2e8f0; height:4px; border-radius:2px; overflow:hidden;">
            <div style="width:${pct}%; background:${col}; height:100%;"></div>
          </div>
        </div>
      `;
    });
  }

  // 2. RENDERIZAR TABLA DE HISTORIAL ESTILIZADA
  const tbody = document.getElementById("hist");
  if (tbody) {
    let html = "";
    if (!reg.length) {
      html = `<tr><td colspan="4" style="text-align:center; padding:20px; color:#64748b; font-style:italic;">Aún no hay registros cargados.</td></tr>`;
    } else {
      reg.forEach((r, i) => {
        let fechaFormateada = r.f;
        if (typeof r.f === "string" && r.f.includes("T")) {
          fechaFormateada = r.f.split("T")[0];
        }

        html += `
          <tr style="border-bottom: 1px solid #f1f5f9; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='transparent'">
            <td style="padding: 12px 16px; font-weight: 600; color: #334155; text-align: center;">${r.p}</td>
            <td style="padding: 12px 16px; color: #475569; text-align: center;">${fechaFormateada}</td>
            <td style="padding: 12px 16px; font-weight: 700; color: #0f172a; text-align: center;">${r.h}</td>
            <td style="padding: 12px 16px; text-align: center;">
              <button onclick="eliminar(${i})" title="Eliminar registro" style="background: #ef4444; color: white; border: none; width: 30px; height: 30px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,0.15);">
                🗑️
              </button>
            </td>
          </tr>
        `;
      });
    }
    tbody.innerHTML = html;
  }
}

// AGREGAR REGISTRO
async function agregar() {
  if (!f.value || !h.value) return alert("Por favor complete la fecha y las horas.");

  const personaVal = p.value;
  const fechaVal = f.value;
  const horasVal = parseFloat(h.value);

  // Agregar visualmente de inmediato
  reg.push({ p: personaVal, f: fechaVal, h: horasVal });
  render();
  h.value = "";

  // Enviar a Google Sheets
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "ADD",
        persona: personaVal,
        fecha: fechaVal,
        horas: horasVal
      })
    });
    // Volver a consultar Sheets pasados 1.5s para sincronizar
    setTimeout(cargarDesdeSheets, 1500);
  } catch (err) {
    console.error("Error al guardar en Sheets:", err);
  }
}

// ELIMINAR REGISTRO ESPECÍFICO DE LA TABLA
async function eliminar(i) {
  if (confirm("¿Desea eliminar este registro del historial?")) {
    const borrado = reg[i];
    reg.splice(i, 1);
    render();

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({
          action: "DELETE",
          persona: borrado.p,
          fecha: borrado.f
        })
      });
      setTimeout(cargarDesdeSheets, 1500);
    } catch (err) {
      console.error("Error al eliminar en Sheets:", err);
    }
  }
}

// ELIMINAR EL ÚLTIMO REGISTRO DE LA PERSONA SELECCIONADA EN EL FORMULARIO
async function borrarUltimo() {
  const personaVal = p.value;
  const fechaVal = f.value;

  if (!confirm(`¿Desea borrar el último registro asignado a ${personaVal}?`)) return;

  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({
        action: "DELETE",
        persona: personaVal,
        fecha: fechaVal
      })
    });
    setTimeout(cargarDesdeSheets, 1500);
  } catch (err) {
    console.error("Error al borrar en Sheets:", err);
  }
}

// Cargar al iniciar
cargarDesdeSheets();
</script>
</body>
</html>
